# ========================================
# Stock Massive - Production Docker Compose
# ========================================
# Usage: docker-compose -f docker-compose.prod.yml up -d

# Pin the project name so image/network names stay stable no matter which
# directory compose is invoked from.
name: stockmassive

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: stockmassive-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
    ports:
      - "8000:8000"
    networks:
      - stockmassive-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yourdomain.com/api/v1}
    container_name: stockmassive-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - stockmassive-network

networks:
  stockmassive-network:
    driver: bridge
