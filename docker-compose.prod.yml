# ========================================
# Stock Massive - Production Docker Compose
# ========================================
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# By default only api + web run here and DATABASE_URL must point at a Postgres
# you manage elsewhere. To self-host Postgres on the same machine, add the `db`
# profile: `docker compose -f docker-compose.prod.yml --profile db up -d`.

# Pin the project name so image/network names stay stable no matter which
# directory compose is invoked from.
name: stockmassive

services:
  # Opt-in self-hosted Postgres. Only started with `--profile db`; without it,
  # DATABASE_URL is expected to point at an external/managed Postgres.
  db:
    profiles: ["db"]
    image: postgres:16-alpine
    container_name: stockmassive-db
    restart: unless-stopped
    environment:
      # Set both in .env before using this profile — the defaults are dev-only
      # and must never reach a public host.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockmassive}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockmassive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stockmassive-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: stockmassive-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      # Read by vnstock; without it the quota is 20 req/min instead of 60
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
    ports:
      - "8000:8000"
    networks:
      - stockmassive-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yourdomain.com/api/v1}
    container_name: stockmassive-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - stockmassive-network

volumes:
  postgres_data:

networks:
  stockmassive-network:
    driver: bridge
