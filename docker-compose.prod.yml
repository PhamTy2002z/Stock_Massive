# ========================================
# Stock Massive - Production Docker Compose
# ========================================
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# By default only api + web run here and DATABASE_URL must point at a Postgres
# you manage elsewhere. To self-host Postgres on the same machine, add the `db`
# profile: `docker compose -f docker-compose.prod.yml --profile db up -d`.

# Pin the project name so image/network names stay stable no matter which
# directory compose is invoked from.
name: stockmassive

services:
  # Opt-in self-hosted Postgres. Only started with `--profile db`; without it,
  # DATABASE_URL is expected to point at an external/managed Postgres.
  db:
    profiles: ["db"]
    image: postgres:16-alpine
    container_name: stockmassive-db
    restart: unless-stopped
    environment:
      # Set both in .env before using this profile — the defaults are dev-only
      # and must never reach a public host.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockmassive}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockmassive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stockmassive-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: stockmassive-api
    restart: unless-stopped
    # Two windows in sequence, and the grace has to cover both
    # (docs/streaming-topology.md).
    #
    # Uvicorn stops accepting, then waits `--timeout-graceful-shutdown` seconds
    # for open connections before cancelling them; only then does the ASGI
    # lifespan shut down, and Alpha Desk's 30 seconds of checkpointing happen
    # inside *that*. An SSE subscriber holds its connection for as long as the
    # Turn runs, so without the connection timeout the lifespan would not begin
    # until the ten-minute deadline expired — and the deploy would SIGKILL the
    # container long before any checkpoint was written.
    #
    # 10s of connection drain + 30s of checkpointing + margin.
    stop_grace_period: 60s
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # Which build answered — one of the Evidence Manifest's fields
      # (docs/adr/0015). Only the deployment knows it.
      GIT_SHA: ${GIT_SHA:-unknown}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # The covered Universe. Empty means *every* symbol is refused by the tool
      # layer, which is a working API serving nothing — so it is passed here for
      # the same reason DATABASE_URL is, and only the deployment knows it.
      UNIVERSE_SYMBOLS: ${UNIVERSE_SYMBOLS:-}
      # Long-lived DNSE ingestion stays off until the deployment explicitly
      # supplies credentials and has applied the realtime migration.
      REALTIME_INGESTION_ENABLED: ${REALTIME_INGESTION_ENABLED:-false}
      DNSE_API_KEY: ${DNSE_API_KEY:-}
      DNSE_API_SECRET: ${DNSE_API_SECRET:-}
      DNSE_BOARD_IDS: ${DNSE_BOARD_IDS:-G1}
      REALTIME_QUEUE_SIZE: ${REALTIME_QUEUE_SIZE:-2000}
      REALTIME_WORKER_COUNT: ${REALTIME_WORKER_COUNT:-1}
      REALTIME_SHUTDOWN_TIMEOUT_SECONDS: ${REALTIME_SHUTDOWN_TIMEOUT_SECONDS:-15}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-true}
      CORPORATE_ACTIONS_ENABLED: ${CORPORATE_ACTIONS_ENABLED:-true}
      MARKET_INDEX_ENABLED: ${MARKET_INDEX_ENABLED:-true}
      # Both default off: they are the two jobs that spend the vnstock quota in
      # bulk, and a deployment that wants them says so.
      BACKFILL_ENABLED: ${BACKFILL_ENABLED:-false}
      SECTOR_HISTORICAL_ENABLED: ${SECTOR_HISTORICAL_ENABLED:-false}
      FIINQUANT_USERNAME: ${FIINQUANT_USERNAME:-}
      FIINQUANT_PASSWORD: ${FIINQUANT_PASSWORD:-}
      # A self-hosted Redis is not part of this file; a deployment either points
      # this at one it runs or uses the Upstash pair below. Empty is handled:
      # the cache degrades and the LLM route breaker fails open.
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      # Read by vnstock; without it the quota is 20 req/min instead of 60
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      # Alpha Desk's LLM route (docs/adr/0014). Off unless the environment says
      # otherwise; with it on, Budget Validation refuses to boot on a price
      # table that cannot fund the ceilings, so every key it reads has to be
      # settable from here rather than baked into the image.
      ALPHA_DESK_ENABLED: ${ALPHA_DESK_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_BATCH: ${LLM_MODEL_BATCH:-gpt-5.6-luna}
      LLM_MODEL_SESSION: ${LLM_MODEL_SESSION:-gpt-5.6-terra}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
      # Properties of the route rather than of a call: a route that streams tool
      # calls without the upstream index cannot be assembled safely, and a
      # thinking route may demand its own reasoning history back.
      LLM_STREAMING_ENABLED: ${LLM_STREAMING_ENABLED:-true}
      LLM_REASONING_HISTORY_REQUIRED: ${LLM_REASONING_HISTORY_REQUIRED:-false}
      # Paid route checks at boot. On by default: a route that does not honour
      # forced tool choice, parallel calls or strict schemas should fail the
      # deployment rather than the first Turn.
      LLM_CAPABILITY_PROBE_ENABLED: ${LLM_CAPABILITY_PROBE_ENABLED:-true}
      # The shared Redis rate-limit breaker. It fails open, so this switch only
      # returns the deployment to discovering each 429 per caller.
      LLM_ROUTE_BREAKER_ENABLED: ${LLM_ROUTE_BREAKER_ENABLED:-true}
      # `cache_control` on the stable prompt prefix. Off until the Capability
      # Probe's `prompt_cache_control` check passes on this route: the field is
      # Anthropic's spelling and an OpenAI-compatible route may refuse the
      # request that carries it.
      LLM_PROMPT_CACHE_CONTROL_ENABLED: ${LLM_PROMPT_CACHE_CONTROL_ENABLED:-false}
      LLM_PRICING_VERSION: ${LLM_PRICING_VERSION:-}
      LLM_PRICING_EFFECTIVE_DATE: ${LLM_PRICING_EFFECTIVE_DATE:-}
      LLM_PRICE_BATCH_INPUT_USD_PER_MTOK: ${LLM_PRICE_BATCH_INPUT_USD_PER_MTOK:-0}
      LLM_PRICE_BATCH_CACHED_INPUT_USD_PER_MTOK: ${LLM_PRICE_BATCH_CACHED_INPUT_USD_PER_MTOK:-0}
      LLM_PRICE_BATCH_CACHE_WRITE_USD_PER_MTOK: ${LLM_PRICE_BATCH_CACHE_WRITE_USD_PER_MTOK:-0}
      LLM_PRICE_BATCH_OUTPUT_USD_PER_MTOK: ${LLM_PRICE_BATCH_OUTPUT_USD_PER_MTOK:-0}
      LLM_PRICE_SESSION_INPUT_USD_PER_MTOK: ${LLM_PRICE_SESSION_INPUT_USD_PER_MTOK:-0}
      LLM_PRICE_SESSION_CACHED_INPUT_USD_PER_MTOK: ${LLM_PRICE_SESSION_CACHED_INPUT_USD_PER_MTOK:-0}
      LLM_PRICE_SESSION_CACHE_WRITE_USD_PER_MTOK: ${LLM_PRICE_SESSION_CACHE_WRITE_USD_PER_MTOK:-0}
      LLM_PRICE_SESSION_OUTPUT_USD_PER_MTOK: ${LLM_PRICE_SESSION_OUTPUT_USD_PER_MTOK:-0}
      # Trần chi tiêu. `0` = không giới hạn, và với ba lane thì phải cả ba
      # cùng 0 (một lane 0 lẫn giữa hai lane có tiền là biến bị bỏ trống, và
      # Budget Validation chặn startup vì lane không được cấp vốn từ chối mọi
      # call). Bản dev/nội bộ chạy qua route thuê bao nên mặc định là 0: ledger
      # vẫn ghi đủ token và giá, chỉ bỏ phần từ chối bằng USD tổng hợp. Trỏ vào
      # API tính tiền theo call thì đặt lại 45/10/30/5.
      LLM_BUDGET_MONTHLY_USD: ${LLM_BUDGET_MONTHLY_USD:-0}
      LLM_BUDGET_ANALYSIS_USD: ${LLM_BUDGET_ANALYSIS_USD:-0}
      LLM_BUDGET_TURN_USD: ${LLM_BUDGET_TURN_USD:-0}
      LLM_BUDGET_EMERGENCY_USD: ${LLM_BUDGET_EMERGENCY_USD:-0}
      # Năm trần per-user của docs/adr/0014 (20 Turn/ngày ICT, $3/ngày, $15/30
      # ngày, 1 Turn đang chạy mỗi account, 3 Turn toàn hệ thống). `0` = không
      # giới hạn từng cái một. LLM_SYSTEM_ACTIVE_TURNS cấu hình cả semaphore
      # trong process lẫn trần trong ledger — hai mặt của cùng một con số.
      LLM_USER_TURN_STARTS_PER_DAY: ${LLM_USER_TURN_STARTS_PER_DAY:-0}
      LLM_USER_ACTIVE_TURNS: ${LLM_USER_ACTIVE_TURNS:-0}
      LLM_SYSTEM_ACTIVE_TURNS: ${LLM_SYSTEM_ACTIVE_TURNS:-0}
      LLM_USER_DAILY_USD: ${LLM_USER_DAILY_USD:-0}
      LLM_USER_ROLLING_30D_USD: ${LLM_USER_ROLLING_30D_USD:-0}
      # The open-web lane (docs/adr/0020). Off without a key, and the denylist
      # and byte ceiling are the two bounds a deployment may want its own values
      # for.
      WEB_TOOLS_ENABLED: ${WEB_TOOLS_ENABLED:-false}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_FETCH_MAX_BYTES: ${WEB_FETCH_MAX_BYTES:-524288}
      WEB_DOMAIN_DENYLIST: ${WEB_DOMAIN_DENYLIST:-}
    ports:
      - "8000:8000"
    networks:
      - stockmassive-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yourdomain.com/api/v1}
    container_name: stockmassive-web
    restart: unless-stopped
    # The Route Handler is a streaming BFF: while a Turn runs it holds one
    # upstream response open and forwards its bytes. Nothing here needs
    # checkpointing — the Turn belongs to the backend, not to this connection
    # (docs/adr/0013) — but a proxied stream deserves the chance to end rather
    # than being severed the instant a deploy starts.
    stop_grace_period: 30s
    environment:
      # The authenticated route handlers call the API from inside the network.
      # Without this they fall back to the public build-time URL and hairpin out
      # through the internet to reach the container next door — slower, and it
      # makes every Alpha Desk request depend on the public hostname resolving
      # from inside the host.
      INTERNAL_API_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - stockmassive-network

  # The outer proxy, opt-in the way `db` is: a deployment terminating TLS at a
  # load balancer it already owns runs without this and satisfies the same
  # contract in its own configuration (docs/streaming-topology.md).
  #
  # Caddy rather than nginx because the one setting that matters here is a
  # default it already gets right: it does not buffer a proxied response body,
  # and `flush_interval -1` states that rather than relying on it. nginx buffers
  # every proxied response unless told otherwise, which turns an event stream
  # into one delivery at the end of the Turn.
  proxy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    container_name: stockmassive-proxy
    restart: unless-stopped
    # Longer than the web container's, because this connection is the outermost
    # one: cutting it first would end a stream whose two inner hops were still
    # being given time to finish it.
    stop_grace_period: 45s
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN is required by the proxy profile}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required by the proxy profile}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api
    networks:
      - stockmassive-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  stockmassive-network:
    driver: bridge
