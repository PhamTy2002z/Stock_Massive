# Pin the project name so image/network names stay stable no matter which
# directory (repo root or a git worktree) compose is invoked from.
# Override per-worktree with COMPOSE_PROJECT_NAME to run several stacks at once.
#
# Development runs the backend only: `docker compose up -d` starts db + api.
# The frontend runs on the host with `pnpm dev:web` (see README).
# To containerise the frontend as well: `docker compose --profile full up -d`.
name: stockmassive

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - stockmassive-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockmassive}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port is configurable — 5432 is often taken by another local stack
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockmassive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stockmassive-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/stockmassive}
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/0}
      # Read by vnstock; without it the quota is 20 req/min instead of 60
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
      # The Collector is the only path that logs into FiinQuant. Left unpassed,
      # the container starts perfectly well and collects nothing — the same
      # silent-empty failure mode the CA bundle fix exists to prevent.
      FIINQUANT_USERNAME: ${FIINQUANT_USERNAME:-}
      FIINQUANT_PASSWORD: ${FIINQUANT_PASSWORD:-}
      # The symbols the system commits to collecting and serving. Empty is a
      # legitimate Universe — the app runs and the Collector has nothing to do.
      UNIVERSE_SYMBOLS: ${UNIVERSE_SYMBOLS:-}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-true}
      BACKFILL_ENABLED: ${BACKFILL_ENABLED:-false}
      # The weekly Corporate Action load. Forwarded like the other job switches
      # so an operator can turn it off from the environment the container
      # actually reads — the setting defaults to on, and a switch that only
      # exists in the settings class is one a container never sees.
      CORPORATE_ACTIONS_ENABLED: ${CORPORATE_ACTIONS_ENABLED:-true}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SECTOR_HISTORICAL_ENABLED: ${SECTOR_HISTORICAL_ENABLED:-false}
    volumes:
      - ./apps/api/src:/code/src
      - ./apps/api/alembic:/code/alembic
    ports:
      # Host port is configurable so a second worktree stack can run alongside
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stockmassive-network

  # Opt-in only. The default dev flow runs the frontend on the host so Next.js
  # gets native file watching and fast rebuilds; start this with
  # `docker compose --profile full up -d` when a container is genuinely needed.
  web:
    profiles: ["full"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      INTERNAL_API_URL: http://api:8000/api/v1
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    ports:
      # Host port is configurable so a second worktree stack can run alongside.
      # Changing this also means updating CORS_ORIGINS to match the new origin.
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - stockmassive-network

volumes:
  postgres_data:
  redis_data:

networks:
  stockmassive-network:
    driver: bridge
