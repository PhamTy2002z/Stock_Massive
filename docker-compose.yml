# Pin the project name so image/network names stay stable no matter which
# directory (repo root or a git worktree) compose is invoked from.
# Override per-worktree with COMPOSE_PROJECT_NAME to run several stacks at once.
#
# Development runs the backend only: `docker compose up -d` starts db + api.
# The frontend runs on the host with `pnpm dev:web` (see README).
# To containerise the frontend as well: `docker compose --profile full up -d`.
name: stockmassive

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - stockmassive-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockmassive}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only: with the default password, a port on every interface is
      # a database anyone on the same network can read.
      #
      # The host port is configurable because 5432 is often taken — a Homebrew
      # Postgres on `127.0.0.1:5432` makes this bind fail outright. Set
      # POSTGRES_PORT (e.g. 5433) in `.env` and point host-side tools at
      # `localhost:<port>`; that also replaces reaching this database through
      # the machine's LAN address, which stops working under this bind.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockmassive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stockmassive-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    # Matches production: an active Turn gets 30 seconds to checkpoint, so the
    # grace period has to be longer than that (docs/adr/0013).
    stop_grace_period: 45s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/stockmassive}
      # Development is the one environment that tolerates the fallback secret
      # below; any other value makes the API refuse a weak AUTH_SECRET at boot.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # A published fallback, tolerable only because the port above is bound to
      # loopback. Set AUTH_SECRET in `.env` to make it required here.
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/0}
      # Alpha Desk's LLM route (docs/adr/0014). Forwarded for the same reason as
      # other runtime settings: a switch that only exists in the settings class
      # is one a container never sees. With ALPHA_DESK_ENABLED true, Budget
      # Validation runs at startup and an unfundable price table refuses to
      # boot — so these are exactly the keys an operator turning the desk on
      # has to be able to set from outside the image.
      ALPHA_DESK_ENABLED: ${ALPHA_DESK_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_BATCH: ${LLM_MODEL_BATCH:-gpt-5.6-luna}
      LLM_MODEL_SESSION: ${LLM_MODEL_SESSION:-gpt-5.6-luna}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
      # A route that streams tool calls without the upstream index can only
      # be called whole. Forwarded like the other switches: a flag that only
      # exists in the settings class is one a container never sees.
      LLM_STREAMING_ENABLED: ${LLM_STREAMING_ENABLED:-true}
      # A thinking route wants its own reasoning back with the tool-call
      # history. Forwarded for the same reason as the switch above.
      LLM_REASONING_HISTORY_REQUIRED: ${LLM_REASONING_HISTORY_REQUIRED:-false}
      # Whether the route reads images. Forwarded for exactly the reason the
      # block above states: a switch that only exists in the settings class is
      # one a container never sees — and unforwarded it fails in the quietest
      # possible way, because uploads still succeed and still store, they just
      # never reach the model. `LLM_VISION_MEASURED_MODEL` travels with it so the
      # startup warning can say the configured model is not the measured one.
      LLM_VISION_ENABLED: ${LLM_VISION_ENABLED:-false}
      LLM_VISION_MEASURED_MODEL: ${LLM_VISION_MEASURED_MODEL:-}
      # The market read's two gates, forwarded for exactly the reason the block
      # above states: a switch that only exists in the settings class is one a
      # container never sees — and unforwarded, both of these fail in the
      # quietest possible way, because the tool simply never appears on any
      # surface and no log line says why.
      #
      # Both defaults are the refusing ones and stay that way. The provider's
      # community licence is personal and non-commercial, so a host reads market
      # data only when it has declared itself the internal one out loud; a
      # deployment that forgets to set these gets no market data rather than an
      # accidental licence breach.
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-production}
      MARKET_DATA_ENABLED: ${MARKET_DATA_ENABLED:-false}
      # The provider's community key (60 requests/min instead of 20). The
      # package reads it from the environment itself, and its presence lifts the
      # host's own request gate to match (`agent/tools/vnstock_provider.py`).
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
      # The startup Capability Probe spends real provider tokens and refuses to
      # boot the whole API when the route cannot answer it. Forwarded so an
      # operator on a constrained route (expired plan, drained credits) can
      # trade the boot-time guarantee for per-Turn failures instead.
      LLM_CAPABILITY_PROBE_ENABLED: ${LLM_CAPABILITY_PROBE_ENABLED:-true}
      LLM_ROUTE_BREAKER_ENABLED: ${LLM_ROUTE_BREAKER_ENABLED:-true}
      LLM_PROMPT_CACHE_CONTROL_ENABLED: ${LLM_PROMPT_CACHE_CONTROL_ENABLED:-false}
      LLM_PRICING_VERSION: ${LLM_PRICING_VERSION:-}
      LLM_PRICING_EFFECTIVE_DATE: ${LLM_PRICING_EFFECTIVE_DATE:-}
      LLM_PRICE_BATCH_INPUT_USD_PER_MTOK: ${LLM_PRICE_BATCH_INPUT_USD_PER_MTOK:-0}
      LLM_PRICE_BATCH_CACHED_INPUT_USD_PER_MTOK: ${LLM_PRICE_BATCH_CACHED_INPUT_USD_PER_MTOK:-0}
      LLM_PRICE_BATCH_CACHE_WRITE_USD_PER_MTOK: ${LLM_PRICE_BATCH_CACHE_WRITE_USD_PER_MTOK:-0}
      LLM_PRICE_BATCH_OUTPUT_USD_PER_MTOK: ${LLM_PRICE_BATCH_OUTPUT_USD_PER_MTOK:-0}
      LLM_PRICE_SESSION_INPUT_USD_PER_MTOK: ${LLM_PRICE_SESSION_INPUT_USD_PER_MTOK:-0}
      LLM_PRICE_SESSION_CACHED_INPUT_USD_PER_MTOK: ${LLM_PRICE_SESSION_CACHED_INPUT_USD_PER_MTOK:-0}
      LLM_PRICE_SESSION_CACHE_WRITE_USD_PER_MTOK: ${LLM_PRICE_SESSION_CACHE_WRITE_USD_PER_MTOK:-0}
      LLM_PRICE_SESSION_OUTPUT_USD_PER_MTOK: ${LLM_PRICE_SESSION_OUTPUT_USD_PER_MTOK:-0}
      # Trần chi tiêu. `0` = không giới hạn, và với ba lane thì phải cả ba
      # cùng 0 (một lane 0 lẫn giữa hai lane có tiền là biến bị bỏ trống, và
      # Budget Validation chặn startup vì lane không được cấp vốn từ chối mọi
      # call). Bản dev/nội bộ chạy qua route thuê bao nên mặc định là 0: ledger
      # vẫn ghi đủ token và giá, chỉ bỏ phần từ chối bằng USD tổng hợp. Trỏ vào
      # API tính tiền theo call thì đặt lại 45/10/30/5.
      LLM_BUDGET_MONTHLY_USD: ${LLM_BUDGET_MONTHLY_USD:-0}
      LLM_BUDGET_ANALYSIS_USD: ${LLM_BUDGET_ANALYSIS_USD:-0}
      LLM_BUDGET_TURN_USD: ${LLM_BUDGET_TURN_USD:-0}
      LLM_BUDGET_EMERGENCY_USD: ${LLM_BUDGET_EMERGENCY_USD:-0}
      # Năm trần per-user của docs/adr/0014 (20 Turn/ngày ICT, $3/ngày, $15/30
      # ngày, 1 Turn đang chạy mỗi account, 3 Turn toàn hệ thống). `0` = không
      # giới hạn từng cái một. LLM_SYSTEM_ACTIVE_TURNS cấu hình cả semaphore
      # trong process lẫn trần trong ledger — hai mặt của cùng một con số.
      #
      # No value on purpose: a key left empty here is forwarded only when the
      # environment sets it, so an unset one falls through to the code's
      # defaults above instead of to `0`. A `:-0` fallback silently turned every
      # ceiling off for a deployment that never mentioned them — and with open
      # registration that is a budget any new account can spend. `${VAR:-}`
      # would not do either: it forwards an empty string, which the integer and
      # float fields refuse at startup.
      LLM_USER_TURN_STARTS_PER_DAY:
      LLM_USER_ACTIVE_TURNS:
      LLM_SYSTEM_ACTIVE_TURNS:
      LLM_USER_DAILY_USD:
      LLM_USER_ROLLING_30D_USD:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_TOOLS_ENABLED: ${WEB_TOOLS_ENABLED:-false}
      WEB_FETCH_MAX_BYTES: ${WEB_FETCH_MAX_BYTES:-524288}
      WEB_DOMAIN_DENYLIST: ${WEB_DOMAIN_DENYLIST:-}
    volumes:
      - ./apps/api/src:/code/src
      - ./apps/api/alembic:/code/alembic
    ports:
      # Loopback only, like the database: this stack signs tokens with a dev
      # secret, so a port on the LAN is an account anyone nearby can mint.
      # Host port is configurable so a second worktree stack can run alongside
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stockmassive-network

  # Opt-in only. The default dev flow runs the frontend on the host so Next.js
  # gets native file watching and fast rebuilds; start this with
  # `docker compose --profile full up -d` when a container is genuinely needed.
  web:
    profiles: ["full"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      INTERNAL_API_URL: http://api:8000/api/v1
      WATCHPACK_POLLING: "true"
    # `pnpm dev` binds loopback so a host-side dev server is not on the LAN.
    # Inside the container loopback is unreachable from the published port, so
    # this one binds every interface; the port below is published on the
    # host's loopback only.
    command: ["pnpm", "exec", "next", "dev", "-H", "0.0.0.0"]
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    ports:
      # Host port is configurable so a second worktree stack can run alongside.
      # Changing this also means updating CORS_ORIGINS to match the new origin.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - stockmassive-network

volumes:
  postgres_data:
  redis_data:

networks:
  stockmassive-network:
    driver: bridge
