[pytest]
markers =
    network: reaches the live vnstock API — excluded from the default run
    redis_server: needs a real Redis — excluded from the default run
    model_behaviour: asks a live model how it behaves — excluded from the default run

# vnstock throttles under load, so these tests fail on upstream 503 rather than
# on anything in this repo. Keeping them out of the default run leaves a suite
# whose red actually means "we broke something".
# Run them deliberately with:  pytest -m network
#
# The quota arbiter's Lua is mirrored in Python by tests/fake_redis.py so the
# default suite stays fast and dependency-free. That mirror is the reason for
# the second marker: the scripts themselves are only proven against a server.
# Run them with:  QUOTA_TEST_REDIS_URL=redis://localhost:6379/15 pytest -m redis_server
#
# The third marker is a different kind of exclusion. Those tests spend real
# model calls, and what they measure — whether a model obeys an order hidden in
# a file a reader uploaded — is a property of a nondeterministic component. Red
# there is a signal to go and read the answer, not a claim that this repo broke.
# Turning them into a CI gate would either block merges on the weather or, worse,
# get rewritten into assertions on fixed strings, which converts a behavioural
# check into a spelling check.
# Run them deliberately with:  pytest -m model_behaviour
addopts = -m "not network and not redis_server and not model_behaviour"
